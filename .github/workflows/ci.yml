name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: talent_incubation_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/talent_incubation_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: corepack pnpm@10.4.1 install --frozen-lockfile
      - name: Apply database migrations
        run: corepack pnpm@10.4.1 db:migrate
      - name: Type check
        run: corepack pnpm@10.4.1 check
      - name: Test
        run: corepack pnpm@10.4.1 test
      - name: Build
        run: corepack pnpm@10.4.1 build
