services:
  mysql:
    image: mysql:8.0
    container_name: talent-incubation-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: talent_incubation_dev
      MYSQL_USER: app_user
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:-change_me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_root_password}
    ports:
      - "3306:3306"
    volumes:
      - talent_incubation_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  talent_incubation_mysql_data:
